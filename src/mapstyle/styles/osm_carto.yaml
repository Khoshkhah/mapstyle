# mapstyle stylesheet — OSM-Carto-ish road widths. Edit these and re-render (no code change).
roads:
  # fill line-width (px) per width-group, by zoom. Groups come from roads.py:road_group
  # (+ the service_minor split). Smoothly interpolated; above the top zoom it grows by hi_rate.
  width:
    major:         {8: 0.8, 10: 1.3, 12: 3.5, 13: 6, 14: 8, 15: 10, 16: 13, 17: 17, 18: 22}
    primary:       {8: 0.7, 10: 1.2, 12: 3.5, 13: 5, 14: 7, 15: 9, 16: 12, 17: 15, 18: 19}
    secondary:     {10: 0.8, 12: 2.5, 13: 4, 14: 6, 15: 8, 16: 10, 17: 13, 18: 17}
    tertiary:      {12: 2, 13: 3, 14: 4.5, 15: 6, 16: 8, 17: 11, 18: 14}
    residential:   {12: 0.5, 13: 1.5, 14: 2.5, 15: 4, 16: 6, 17: 9, 18: 13}
    living_street: {13: 2, 14: 2.5, 15: 4, 16: 6, 17: 9, 18: 13}
    service:       {13: 0.8, 14: 1.2, 15: 2, 16: 2.8, 17: 4, 18: 5}
    service_minor: {14: 0.6, 15: 1, 16: 1.6, 17: 2.4, 18: 3.2}
    pedestrian:    {13: 2, 14: 3, 15: 4, 16: 6, 17: 9, 18: 13}
    path:          {12: 0.4, 13: 0.6, 14: 0.8, 15: 1, 16: 1.4, 17: 2, 18: 2.6, 19: 3}

  # growth per zoom ABOVE each group's top anchor (roads keep widening; paths stay thin)
  hi_rate:
    major: 2.0
    primary: 2.0
    secondary: 2.0
    tertiary: 1.95
    residential: 1.9
    living_street: 1.9
    service: 1.9
    service_minor: 1.8
    pedestrian: 1.85
    path: 1.3

  # casing (road outline) line-width = fill * ratio
  casing_ratio:
    major: 1.17
    primary: 1.18
    secondary: 1.19
    tertiary: 1.21
    residential: 1.24
    living_street: 1.24
    service: 1.27
    service_minor: 1.3
    pedestrian: 1.21
    path: 1.0

  # road colours (openstreetmap-carto), by highway class.
  #   fill   = the road colour
  #   casing = the road EDGE (outline) colour — null for path-like classes (drawn dashed, no edge)
  #   dash   = [on, off] px for dashed lines (omit for a solid line)
  colors:
    motorway:      {fill: "#e892a2", casing: "#c24e6b"}
    trunk:         {fill: "#f9b29c", casing: "#c84e2f"}
    primary:       {fill: "#fcd6a4", casing: "#a06b00"}
    secondary:     {fill: "#f7fabf", casing: "#707d00"}
    tertiary:      {fill: "#ffffff", casing: "#8f8f8f"}
    unclassified:  {fill: "#ffffff", casing: "#bbbbbb"}
    residential:   {fill: "#ffffff", casing: "#bbbbbb"}
    living_street: {fill: "#ededed", casing: "#bbbbbb"}
    service:       {fill: "#ffffff", casing: "#bbbbbb"}
    pedestrian:    {fill: "#dddde8", casing: "#b3b3c2"}
    footway:       {fill: "#fa8072", casing: null, dash: [4, 3]}
    path:          {fill: "#fa8072", casing: null, dash: [3, 4]}
    steps:         {fill: "#fa8072", casing: null, dash: [1, 1]}
    cycleway:      {fill: "#6666ff", casing: null, dash: [4, 3]}
    bridleway:     {fill: "#1c8b3c", casing: null, dash: [5, 3]}
    track:         {fill: "#ac8327", casing: null, dash: [4, 4]}
    construction:  {fill: "#ffffff", casing: "#bbbbbb", dash: [5, 4]}
    corridor:      {fill: "#fa8072", casing: null, dash: [2, 3]}
    raceway:       {fill: "#ffc0cb", casing: "#bbbbbb"}
    busway:        {fill: "#ffffff", casing: "#bbbbbb"}

# oneway direction arrows (openstreetmap-carto look). Tune density/size/start-zoom here.
arrows:
  min_zoom:    16        # don't draw arrows below this zoom
  spacing_px:  120       # target on-screen gap between arrows — LOWER = MORE arrows
  size_px:     6         # arrow icon size, in pixels (also the cap; arrows scale down on thin roads)
  color:       "#8a8a8a" # arrow fill colour (gray reads better than a dark slate)
  sample_m:    10        # base sampling step along the road (metres); keep well below the smallest
                         # on-screen cell so every cell gets an arrow (bake density, not final count)

# street-name labels. Each name is sized to fit its road in BOTH directions (length + width) and
# repeated along long roads; tune the size range / density here.
names:
  min_size:    10        # smallest font (px); below this the name is hidden (road too short/thin)
  max_size:    22        # largest font (px); cap so names never get huge
  width_ratio: 1.25      # font size as a multiple of the road's painted width (keeps text inside it)
  glyph:       0.64      # average glyph width as a fraction of font size (text-width estimate)
  repeat_px:   300       # minimum on-screen gap between repeats of the same name
  sample_m:    80        # spacing of label candidates along each road (bake density)

# ---- FEATURES ------------------------------------------------------------------------------------
# Base-map feature-layer styling (everything render_merge draws under the roads via feature_layers).
# All colours / sizes / icons live HERE, not in code — edit and re-render. Keyed by the layer name
# passed to load_layer. Area fills may key by feature `class`; `default` catches the rest.
features:
  areas:                             # polygon fills (+ optional outline, fill opacity 0..1)
    water:      {fill: "#aad3df", outline: null,      opacity: 1.0}
    buildings:  {fill: "#d9d0c9", outline: "#c2b8ac", opacity: 0.9}
    parking:    {fill: "#eeeeee", outline: "#dddddd", opacity: 0.7}
    landcover:                       # by OSM class (landuse/natural/leisure), else `default`
      forest: "#add19e"
      wood: "#add19e"
      grass: "#cdebb0"
      grassland: "#cdebb0"
      meadow: "#cdebb0"
      park: "#c8facc"
      garden: "#cfeda5"
      residential: "#e0dfdf"
      commercial: "#f2dad9"
      retail: "#ffd6d1"
      industrial: "#ebdbe8"
      railway: "#ebdbe8"
      farmland: "#eef0d5"
      farmyard: "#f5dcba"
      orchard: "#aedfa3"
      vineyard: "#aedfa3"
      allotments: "#c9e1bf"
      cemetery: "#aacbaf"
      scrub: "#c8d7ab"
      heath: "#d6d99f"
      wetland: "#add19e"
      sand: "#f5e9c6"
      quarry: "#c5c3c3"
      brownfield: "#b6b592"
      recreation_ground: "#dffce2"
      pitch: "#aae0cb"
      nature_reserve: "#d5e8d1"
      golf_course: "#b5e3b5"
      default: "#e8e6df"
  lines:                             # line colour + width (px) + optional [on,off] dash
    waterways:  {color: "#4a90d9", width: 1.6}
    railways:   {color: "#707070", width: 1.4, dash: [6, 4]}
  points:                            # per-category: colour (tints the SVG), size (MULTIPLIER on the icon curve), icon (SVG file in mapstyle/icons/), min_zoom
    train_stations:  {color: "#8b008b", size: 1.4,  icon: "train.svg", min_zoom: 12}
    parking:         {color: "#2b6cb0", size: 1.0,  icon: "parking.svg", min_zoom: 14}
    bus_stations:    {color: "#1e6eb4", size: 1.0,  icon: "bus.svg", min_zoom: 14}
    bicycle:         {color: "#2e8b57", size: 0.9,  icon: "bicycle.svg", min_zoom: 15}
    traffic_signals: {color: "#d64545", size: 0.9,  icon: "traffic_light.svg", min_zoom: 15}
    crossings:       {color: "#5a5a5a", size: 0.85, icon: "crossing.svg", min_zoom: 16}
    default:         {color: "#808080", size: 1.0,  min_zoom: 14}
  icon:                              # icon pixel size BY ZOOM — interpolated like roads.width; a category's `size` scales it
    size:    {12: 5, 14: 9, 16: 14, 18: 22, 20: 32}
    hi_rate: 1.5                      # growth per zoom above the top anchor (like roads.hi_rate)
    opacity: 0.8                      # icon opacity (lighter <1)
    color:   "#8a8a8a"               # icon tint (matters for monochrome emoji; native colour in most browsers)
