# mapstyle stylesheet — road widths + colours. Edit these and re-render (no code change).
roads:
  # ---- PHYSICAL WIDTH MODEL (see docs/width-model.md) ------------------------------------------
  # Road width is PHYSICAL, not a hand-tuned pixel table. Each DIRECTED edge's base width in metres
  # = its lane count (OSM `lanes`, directional) x lane_m[class]. It is then drawn as
  #     width_px = base_metres x (1 / metres_per_pixel) x zoom_boost(zoom)
  # `1/metres_per_pixel` (true physical scale, latitude-correct) is computed at render time; the ONE
  # global `zoom_boost` curve is the only per-zoom knob and is shared by ALL classes, so class-to-class
  # width ratios stay fixed at every zoom. A one-way road = one line at its lanes; a two-way road =
  # two directional lines (each sized by ITS lanes), offset +/-base/2 so they sit edge-to-edge.
  width_model:
    # physical metres per lane, by class (class = importance; a trunk lane reads wider than a service lane)
    lane_m:
      default:       3.0
      major:         3.0
      trunk:         3.0
      primary:       3.0
      secondary:     3.0
      tertiary:      3.0
      residential:   2.75
      living_street: 2.75
      service:       2.75
      service_minor: 2.5
      pedestrian:    2.5
      path:          1.5
    # FIXED lane count by class. Width is NOT read from OSM lane tags (too noisy — turn-lane bulges,
    # unreliable single-track; 91% of roads are untagged anyway). base width (metres) = lanes x lane_m.
    # `lanes` = lanes PER DIRECTION of a TWO-WAY road (each direction drawn at this; 0.5 = single-track,
    #   one lane shared both ways).
    lanes:
      default:       1
      major:         2
      trunk:         2
      primary:       1.5
      secondary:     1
      tertiary:      1
      residential:   1
      living_street: 0.5
      service:       0.5
      service_minor: 0.5
      pedestrian:    0.5
      path:          0.5
    # `lanes_oneway` = TOTAL lanes of a ONE-WAY road (drawn centred). A dual-carriageway arterial
    #   carriageway is usually 2; a one-way minor street is 1 (not single-track — it isn't shared).
    lanes_oneway:
      default:       1
      major:         2
      trunk:         2
      primary:       2
      secondary:     2
      tertiary:      1
      residential:   1
      living_street: 1
      service:       1
      service_minor: 1
      pedestrian:    1
      path:          0.5
    # ONE global legibility multiplier OVER true physical size, by zoom (interpolated; flat ->1.0 = true
    # scale at high zoom, lifted at low zoom so thin roads stay visible). NOTE it DECREASES with zoom
    # because the physical (1/mpp) factor already grows 2x/zoom — net width still grows. See the doc.
    zoom_boost:
      12: 9.0
      14: 4.0
      15: 2.6
      16: 1.8
      17: 1.3
      18: 1.1
      20: 1.0
    lane_overlap:  1.15      # two directional lanes overlap this much at the centre (no seam, no gap)

  # casing (road outline) line-width = fill * ratio
  casing_ratio:
    major: 1.17
    primary: 1.18
    secondary: 1.19
    tertiary: 1.21
    residential: 1.24
    living_street: 1.24
    service: 1.27
    service_minor: 1.3
    pedestrian: 1.21
    path: 1.0

  # classes hidden below this zoom (declutter minor roads / paths when zoomed out); absent = always shown
  min_zoom:
    living_street: 15
    service:       15
    pedestrian:    15
    footway:       15
    path:          15
    steps:         15
    cycleway:      15
    bridleway:     15
    track:         15
    construction:  15
    corridor:      15
    raceway:       15
    busway:        15

  # road colours (openstreetmap-carto), by highway class.
  #   fill   = the road colour
  #   casing = the road EDGE (outline) colour — null for path-like classes (drawn dashed, no edge)
  #   dash   = [on, off] px for dashed lines (omit for a solid line)
  colors:
    motorway:      {fill: "#e892a2", casing: "#c24e6b"}
    trunk:         {fill: "#f9b29c", casing: "#c84e2f"}
    primary:       {fill: "#fcd6a4", casing: "#a06b00"}
    secondary:     {fill: "#f7fabf", casing: "#707d00"}
    tertiary:      {fill: "#ffffff", casing: "#8f8f8f"}
    unclassified:  {fill: "#ffffff", casing: "#bbbbbb"}
    residential:   {fill: "#ffffff", casing: "#bbbbbb"}
    living_street: {fill: "#ededed", casing: "#bbbbbb"}
    service:       {fill: "#ffffff", casing: "#bbbbbb"}
    pedestrian:    {fill: "#dddde8", casing: "#b3b3c2"}
    footway:       {fill: "#fa8072", casing: null, dash: [4, 3]}
    path:          {fill: "#fa8072", casing: null, dash: [3, 4]}
    steps:         {fill: "#fa8072", casing: null, dash: [1, 1]}
    cycleway:      {fill: "#6666ff", casing: null, dash: [4, 3]}
    bridleway:     {fill: "#1c8b3c", casing: null, dash: [5, 3]}
    track:         {fill: "#ac8327", casing: null, dash: [4, 4]}
    construction:  {fill: "#ffffff", casing: "#bbbbbb", dash: [5, 4]}
    corridor:      {fill: "#fa8072", casing: null, dash: [2, 3]}
    raceway:       {fill: "#ffc0cb", casing: "#bbbbbb"}
    busway:        {fill: "#ffffff", casing: "#bbbbbb"}

# oneway direction arrows (openstreetmap-carto look). Tune density/size/start-zoom here.
arrows:
  min_zoom:    16        # don't draw arrows below this zoom
  spacing_px:  120       # target on-screen gap between arrows — LOWER = MORE arrows
  size_px:     6         # arrow icon size, in pixels (also the cap; arrows scale down on thin roads)
  color:       "#8a8a8a" # arrow fill colour (gray reads better than a dark slate)
  sample_m:    10        # base sampling step along the road (metres); keep well below the smallest
                         # on-screen cell so every cell gets an arrow (bake density, not final count)

# street-name labels. Each name is sized to fit its road in BOTH directions (length + width) and
# repeated along long roads; tune the size range / density here.
names:
  min_size:    10        # smallest font (px); below this the name is hidden (road too short/thin)
  max_size:    22        # largest font (px); cap so names never get huge
  width_ratio: 1.25      # font size as a multiple of the road's painted width (keeps text inside it)
  glyph:       0.64      # average glyph width as a fraction of font size (text-width estimate)
  repeat_px:   300       # minimum on-screen gap between repeats of the same name
  sample_m:    80        # spacing of label candidates along each road (bake density)
  # color:     "#8a8a8a" # label colour; when unset it follows the oneway arrows' colour (arrows.color)
  halo:        0         # white halo/shadow width (px) behind each name; 0 = no shadow

# ---- FEATURES ------------------------------------------------------------------------------------
# Base-map feature-layer styling (everything render_merge draws under the roads via feature_layers).
# All colours / sizes / icons live HERE, not in code — edit and re-render. Keyed by the layer name
# passed to load_layer. Area fills may key by feature `class`; `default` catches the rest.
features:
  areas:                             # polygon fills (+ optional outline, fill opacity 0..1)
    water:       {fill: "#aad3df", outline: null,      opacity: 1.0}
    buildings:   {fill: "#d9d0c9", outline: "#c2b8ac", opacity: 0.9,  min_zoom: 15}
    parking:     {fill: "#eeeeee", outline: "#dddddd", opacity: 0.7,  min_zoom: 15}
    bus_station: {fill: "#d6e4f0", outline: "#9db8d2", opacity: 0.85, min_zoom: 15}  # bus terminal footprint (light blue, matches the bus icon)
    platform:    {fill: "#bbbbbb", outline: "#969696", opacity: 0.9}   # transit platform (osm-carto grey)
    landcover:                       # by OSM class (landuse/natural/leisure), else `default`
      forest: "#add19e"
      wood: "#add19e"
      grass: "#cdebb0"
      grassland: "#cdebb0"
      meadow: "#cdebb0"
      park: "#c8facc"
      garden: "#cfeda5"
      residential: "#e0dfdf"
      commercial: "#f2dad9"
      retail: "#ffd6d1"
      industrial: "#ebdbe8"
      railway: "#ebdbe8"
      farmland: "#eef0d5"
      farmyard: "#f5dcba"
      orchard: "#aedfa3"
      vineyard: "#aedfa3"
      allotments: "#c9e1bf"
      cemetery: "#aacbaf"
      scrub: "#c8d7ab"
      heath: "#d6d99f"
      wetland: "#add19e"
      sand: "#f5e9c6"
      quarry: "#c5c3c3"
      brownfield: "#b6b592"
      recreation_ground: "#dffce2"
      pitch: "#aae0cb"
      nature_reserve: "#d5e8d1"
      golf_course: "#b5e3b5"
      playground: "#dffce2"          # leisure=playground — GREEN in OSM (was falling to grey default)
      village_green: "#cdebb0"       # grass green
      garages: "#dfddce"             # landuse=garages (muted)
      greenfield: "#f1eee8"          # undeveloped land (very light)
      beach: "#fff1ba"               # natural=beach (sandy)
      default: "#e8e6df"
  lines:                             # line colour + width (px) + optional [on,off] dash
    waterways:    {color: "#4a90d9", width: 1.6}
    railways:     {color: "#707070", width: 1.4, dash: [6, 4]}
  points:                            # per-category: colour (tints the SVG), size (MULTIPLIER on the icon curve), icon (SVG file in mapstyle/icons/), min_zoom
    train_stations:  {color: "#8b008b", size: 1.4,  icon: "train.svg", min_zoom: 12}
    parking_p:       {color: "#2b6cb0", size: 1.0,  icon: "parking_p.svg", min_zoom: 16}  # bare blue "P" letter (no box) at the parking polygon's centroid (the polygon itself is styled under features.areas.parking)
    bus_stations:    {color: "#1e6eb4", size: 1.0,  icon: "bus.svg", min_zoom: 16}
    bicycle:         {color: "#2e8b57", size: 0.9,  icon: "bicycle.svg", min_zoom: 16}
    traffic_signals: {color: "#d64545", size: 0.9,  icon: "traffic_light.svg", min_zoom: 16}
    crossings:       {color: "#5a5a5a", size: 0.85, icon: "crossing.svg", min_zoom: 16}
    default:         {color: "#808080", size: 1.0,  min_zoom: 14}
  icon:                              # icon pixel size BY ZOOM — interpolated like roads.width; a category's `size` scales it
    size:    {12: 5, 14: 9, 16: 14, 18: 22, 20: 32}
    hi_rate: 1.5                      # growth per zoom above the top anchor (like roads.hi_rate)
    opacity: 0.8                      # icon opacity (lighter <1)
    color:   "#8a8a8a"               # icon tint (matters for monochrome emoji; native colour in most browsers)
