[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapstyle"
version = "0.0.1"
description = "A duckOSM database as a full interactive map (roads per travel mode + base-map layers), drawn by roadstyle"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kaveh" }]
keywords = ["osm", "basemap", "roadstyle", "duckosm", "maplibre", "cartography"]

dependencies = [
    "roadstyle>=0.9.3",   # the page (band_col); installed editable from ../roadstyle
    "duckdb",             # reads the duckOSM db
    "geopandas",
    "pyyaml",             # styles/*.yaml
    "pillow",             # landcover texture tiles (patterns.py)
]

[project.optional-dependencies]
tiles = ["roadstyle[tiles]"]   # --tiles / render_map(tiles=True)
dev = ["pytest"]

[project.scripts]
mapstyle = "mapstyle.map:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mapstyle = ["styles/*.yaml", "icons/*.svg", "*.js"]
